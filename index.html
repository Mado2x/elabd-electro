<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض أولاد العبد للأجهزة الكهربائية والمنزلية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } }
      }
    }
  </script>
  <style>
    body { font-family: 'Cairo', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .light .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    #barcode-scanner-box video { width: 100% !important; height: auto !important; border-radius: 1.25rem; }
    .dark .glass-card { background: linear-gradient(135deg, rgba(19, 29, 51, 0.75) 0%, rgba(13, 20, 36, 0.85) 100%); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .glass-card { background: #ffffff; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .ambient-glow-blue { position: absolute; width: 320px; height: 320px; background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(0,0,0,0) 70%); pointer-events: none; filter: blur(50px); }

    @media print {
      body * { visibility: hidden; }
      #printableReceiptArea, #printableReceiptArea * { visibility: visible; }
      #printableReceiptArea { position: absolute; left: 0; top: 0; width: 80mm; background: white; color: black; padding: 10px; font-family: 'Cairo', sans-serif; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-[#080c15] dark:text-slate-100 min-h-screen pb-16 md:pb-0 flex flex-col md:flex-row relative selection:bg-blue-600 selection:text-white">

  <!-- واجهة تسجيل الدخول النظيفة مع نسيت كلمة السر -->
  <div id="appLoginOverlay" class="fixed inset-0 z-[200] bg-slate-900/95 backdrop-blur-2xl flex items-center justify-center p-4">
    <div class="w-full max-w-sm glass-card dark:bg-[#0e1628] border border-slate-300 dark:border-slate-700/80 rounded-3xl p-6 shadow-2xl space-y-4 text-center">
      <div class="w-16 h-16 mx-auto rounded-3xl bg-gradient-to-tr from-blue-600 to-cyan-500 p-0.5 shadow-xl shadow-blue-500/25">
        <div class="w-full h-full bg-white dark:bg-[#0a0f1d] rounded-3xl flex items-center justify-center text-blue-600 dark:text-cyan-400">
          <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
      </div>
      <div>
        <h2 class="text-base font-black text-slate-900 dark:text-white">معرض أولاد العبد</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">يرجى تسجيل الدخول للوصول إلى النظام</p>
      </div>

      <div class="space-y-3.5 text-right">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">اسم المستخدم</label>
          <div class="relative">
            <input type="text" id="loginUsernameInput" autocomplete="off" placeholder="" class="w-full bg-slate-50 dark:bg-[#080d19] border border-slate-300 dark:border-slate-800 rounded-2xl p-3 text-slate-900 dark:text-white text-xs outline-none focus:border-blue-500 pr-9 transition">
            <span class="absolute right-3.5 top-3.5 text-slate-400"><i class="fa-solid fa-user text-xs"></i></span>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">كلمة المرور</label>
            <button type="button" onclick="openForgotPasswordPrompt()" class="text-[11px] text-cyan-500 hover:underline">نسيت كلمة السر؟</button>
          </div>
          <div class="relative">
            <input type="password" id="loginPasswordInput" autocomplete="off" placeholder="" class="w-full bg-slate-50 dark:bg-[#080d19] border border-slate-300 dark:border-slate-800 rounded-2xl p-3 text-slate-900 dark:text-white text-xs outline-none focus:border-blue-500 pr-9 transition">
            <span class="absolute right-3.5 top-3.5 text-slate-400"><i class="fa-solid fa-key text-xs"></i></span>
          </div>
        </div>

        <p id="loginErrorMsg" class="text-[11px] text-rose-500 text-center font-bold hidden"></p>

        <button type="button" onclick="handleSystemLogin()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:brightness-110 text-white rounded-2xl text-xs font-black shadow-lg shadow-blue-600/30 transition transform active:scale-95">
          دخول للنظام <i class="fa-solid fa-arrow-left mr-1"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="ambient-glow-blue top-0 right-10 hidden dark:block"></div>

  <!-- حاوية الإشعارات -->
  <div id="toastNotificationBox" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 transform -translate-y-24 opacity-0 pointer-events-none flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl border backdrop-blur-md max-w-sm w-[90%] md:w-auto">
    <div id="toastIconBox" class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0"></div>
    <div>
      <h4 id="toastTitle" class="text-xs font-bold leading-tight"></h4>
      <p id="toastMessage" class="text-[11px] mt-0.5 leading-tight"></p>
    </div>
  </div>

  <!-- القائمة الجانبية -->
  <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-64 bg-white/95 dark:bg-[#0a0f1d]/95 backdrop-blur-xl border-l border-slate-200 dark:border-slate-800/80 flex flex-col shrink-0 transform translate-x-full md:translate-x-0 transition-transform duration-300 md:static shadow-2xl">
    <div class="p-4 border-b border-slate-200 dark:border-slate-800/80 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-500 p-0.5 shadow-lg shadow-blue-500/20">
          <div class="w-full h-full bg-white dark:bg-[#0a0f1d] rounded-2xl flex items-center justify-center text-blue-600 dark:text-cyan-400">
            <i class="fa-solid fa-plug text-lg"></i>
          </div>
        </div>
        <div>
          <h2 class="text-sm font-black text-slate-900 dark:text-white tracking-wide">أولاد العبد</h2>
          <p class="text-[10px] text-blue-600 dark:text-cyan-400 font-bold">للأجهزة الكهربائية</p>
        </div>
      </div>
      <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-800 dark:hover:text-white p-1 rounded-xl"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
